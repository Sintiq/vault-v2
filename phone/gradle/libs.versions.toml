[versions]
agp = "8.7.3"
kotlin = "2.0.21"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
serialization = "1.7.3"
okhttp = "4.12.0"
nanohttpd = "2.3.1"
junit = "4.13.2"
json = "20240303"
# 1.1.0-alpha07 is the last client that builds against compileSdk 34.
healthConnect = "1.1.0-alpha07"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# The android.jar stub throws on every org.json call; the real one lets the
# receipt log be tested on a plain JVM, with no emulator in the loop.
json = { group = "org.json", name = "json", version.ref = "json" }
health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
